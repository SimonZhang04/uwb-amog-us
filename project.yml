name: UWBDistance
options:
  bundleIdPrefix: com.simonzh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  UWBDistance:
    type: application
    platform: iOS
    sources: [UWBDistance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonzh.uwbdistance
        DEVELOPMENT_TEAM: 69U8N3JUUR
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: "Used to measure distance to nearby phones."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Used to find and connect to nearby phones running this app."
    info:
      path: UWBDistance/Info.plist
      properties:
        NSBonjourServices: ["_uwbdist._tcp", "_uwbdist._udp"]
  UWBDistanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UWBDistanceTests]
    dependencies:
      - target: UWBDistance
schemes:
  UWBDistance:
    build:
      targets:
        UWBDistance: all
    test:
      targets: [UWBDistanceTests]
